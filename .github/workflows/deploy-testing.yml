name: Deploy to Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build-react

      - name: Run React unit tests
        run: npm run test-react

      - name: Run API tests
        run: npm run test-API

      - name: Run ESLint
        run: npx eslint src/ --ext .js,.jsx --max-warnings=0 || true

  deploy-testing:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build-react

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/deploy_key
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_TESTING_IP }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: tar -czf deploy.tar.gz --exclude='node_modules' --exclude='.git' . || true

      - name: Copy to server
        run: scp -i ~/.ssh/deploy_key deploy.tar.gz ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_TESTING_IP }}:~/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_TESTING_IP }} << 'EOF'
            cd ~
            rm -rf app
            mkdir -p app
            tar -xzf deploy.tar.gz -C app
            cd app
            npm ci --production
            pm2 delete reactnode-app 2>/dev/null || true
            pm2 start index.js --name reactnode-app
            pm2 save
          EOF

  notify-success:
    needs: deploy-testing
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Send Success Email to QA
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Testing Deployment Successful - ReactNode-DevOps"
          to: ${{ secrets.QA_EMAIL }}
          from: GitHub Actions
          body: |
            Deployment to Testing environment was successful!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
            
            Access the app at: http://${{ secrets.EC2_TESTING_IP }}:3000

  notify-failure:
    needs: [build-and-test, deploy-testing]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Testing Deployment Failed - ReactNode-DevOps"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions
          body: |
            Deployment to Testing environment failed!
            
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
